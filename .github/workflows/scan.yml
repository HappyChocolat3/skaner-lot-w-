name: Skan lotów

on:
  schedule:
    # Raporty o 9, 12, 15 i 18 czasu polskiego. Cron działa w UTC, więc uruchamiamy
    # o :45 w obu wariantach (czas letni i zimowy), a skrypt sam sprawdza, czy to pora raportu.
    - cron: "45 6,7,9,10,12,13,15,16 * * *"
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions = raport od razu

permissions:
  contents: write             # zapis historii cen (data/state.json)

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skanuj ceny i wyślij powiadomienia
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m skaner run ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Zapisz historię cen
        run: |
          git config user.name "flight-scanner-bot"
          git config user.email "flight-scanner-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Aktualizacja cen lotów [skip ci]"
          git push || (git pull --rebase && git push)
