name: Skan lotów

on:
  schedule:
    - cron: "17 */6 * * *"   # co 6 godzin (UTC)
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write             # zapis historii cen (data/state.json)

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skanuj ceny i wyślij powiadomienia
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m skaner run

      - name: Zapisz historię cen
        run: |
          git config user.name "flight-scanner-bot"
          git config user.email "flight-scanner-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Aktualizacja cen lotów [skip ci]"
          git push
