# Konfiguracja skanera lotów.
# Sekrety (tokeny) NIE trafiają tutaj – podaj je w zmiennych środowiskowych
# albo w GitHub Secrets (patrz README).

[search]
# Przystanki trasy, po kolei. Skaner szuka lotów w jedną stronę na każdym odcinku:
# lotniska domowe → przystanek 1 → … → ostatni przystanek → lotniska domowe.
# Np. ["LAS", "MIA"]: Polska → Las Vegas, Las Vegas → Miami, Miami → Polska.
# Zwykle wybierasz je na stronie (GitHub Pages) – wtedy zapisują się w data/settings.json
# i mają pierwszeństwo przed tą listą.
destinations = ["LAS", "MIA"]

# Lotniska domowe: wylot na pierwszym odcinku i przylot na ostatnim.
# Pełna lista znanych lotnisk: python -m skaner airports
origins = [
  "WAW", "WMI", "KRK", "KTW", "GDN", "WRO", "POZ", "RZE",   # Polska
  "PRG", "OSR",                                             # Czechy
  "BER", "DRS", "LEJ",                                      # Niemcy
]

# Od którego miesiąca (włącznie) szukać lotów – wcześniejsze terminy są pomijane.
since = "2027-06"
# Do którego miesiąca (włącznie) szukać lotów. Linie sprzedają bilety ok. 11–12 miesięcy
# do przodu – dalsze miesiące pojawią się w raporcie, gdy tylko ruszy sprzedaż.
until = "2028-12"
# Zamiast "until" można podać liczbę miesięcy od bieżącego:
# months_ahead = 12

currency = "PLN"

# Maks. liczba przesiadek na jednym locie (0 = tylko bezpośrednie). Usuń linię, żeby wyłączyć.
# 1, bo loty z 2 przesiadkami trwają zwykle ok. doby.
max_transfers = 1

# Dodatkowy koszt dojazdu do/z lotniska (PLN). Uwzględniany przy porównaniu – i przy
# wylocie, i przy powrocie – żeby np. lot z Berlina tańszy o 50 zł nie wygrywał z Warszawą.
[search.extra_cost]
BER = 150
DRS = 150
LEJ = 200
PRG = 150
OSR = 80

[notify]
# "telegram" albo "console" (tylko log, bez wysyłki)
channel = "telegram"

# Godziny wysyłania raportu z najtańszymi ofertami.
report_hours = [9, 12, 15, 18]
timezone = "Europe/Warsaw"

# Ile najtańszych ofert pokazać w raporcie dla każdego odcinka trasy.
# Pełna lista jest na stronie.
report_top = 3

# Miesiąc dostaje w raporcie oznaczenie 🔥, gdy cena spadła poniżej dotychczasowego
# minimum o co najmniej tyle procent.
min_drop_percent = 2

# Opcjonalnie: oznacz 🔥, gdy cena spadnie poniżej tej kwoty (0 = wyłączone).
alert_below = 0

[provider]
name = "travelpayouts"
market = "pl"
