# Konfiguracja skanera lotów.
# Sekrety (tokeny, numer telefonu) NIE trafiają tutaj – podaj je w zmiennych środowiskowych
# albo w GitHub Secrets (patrz README).

[search]
# Kody IATA celów. W przyszłości wystarczy dopisać kolejne, np. ["LAS", "JFK", "BKK"].
destinations = ["LAS"]

# Lotniska wylotowe. Pełna lista znanych lotnisk: python -m skaner airports
origins = [
  "WAW", "WMI", "KRK", "KTW", "GDN", "WRO", "POZ", "RZE",   # Polska
  "PRG", "OSR",                                             # Czechy
  "BER", "DRS", "LEJ",                                      # Niemcy
]

# Do którego miesiąca (włącznie) szukać lotów. Linie sprzedają bilety ok. 11–12 miesięcy
# do przodu – dalsze miesiące pojawią się w raporcie, gdy tylko ruszy sprzedaż.
until = "2028-12"
# Zamiast "until" można podać liczbę miesięcy od bieżącego:
# months_ahead = 12

# false = lot w obie strony, true = tylko w jedną stronę
one_way = false

currency = "PLN"

# Filtry – usuń linię, żeby wyłączyć
max_transfers = 2      # maks. przesiadek w jedną stronę (0 = tylko bezpośrednie)
min_trip_days = 7      # min. długość pobytu w dniach (tylko loty w obie strony)
max_trip_days = 21     # maks. długość pobytu w dniach

# Dodatkowy koszt dojazdu do lotniska (PLN). Uwzględniany przy porównaniu,
# żeby np. lot z Berlina tańszy o 50 zł nie wygrywał z lotem z Warszawy.
[search.extra_cost]
BER = 150
DRS = 150
LEJ = 200
PRG = 150
OSR = 80

[notify]
# "telegram" albo "console" (tylko log, bez wysyłki)
channel = "telegram"

# Godziny wysyłania raportu z najtańszymi cenami na każdy miesiąc.
report_hours = [9, 12, 15, 18]
timezone = "Europe/Warsaw"

# Miesiąc dostaje w raporcie oznaczenie 🔥, gdy cena spadła poniżej dotychczasowego
# minimum o co najmniej tyle procent.
min_drop_percent = 2

# Opcjonalnie: oznacz 🔥, gdy cena spadnie poniżej tej kwoty (0 = wyłączone).
alert_below = 0

[provider]
name = "travelpayouts"
market = "pl"
